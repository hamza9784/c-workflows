#name of the workflow
name: My workflows 

#Define the trigger event
on: [push]

#jobs run in parallel by default, each runs steps in sequence
jobs:
    #job to print something out
    say-hello:
        runs-on: ubuntu-latest
        steps:
            - run: echo "Hello, github actions!"

    # JObs to build and test our code
    needs: [say-hello]
    runs-on: ubuntu-latest
    steps:
        #use github.com/actions/checkout to checkout this repo
      - name: check out this repo
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt install -y build-essential python3
        
        # see we are in the VM
      - run: pwd
        
        # Run our test
      - name: Run test
        run: python3 test.py
